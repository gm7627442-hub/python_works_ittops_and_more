<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск фильмов (OMDB API)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="main-title">🎬 Поиск фильмов</h1>

        <form class="search-form" id="searchForm">
            <div class="form-group">
                <label for="titleInput">Title:</label>
                <input type="text" id="titleInput" placeholder="Название фильма..." required>
            </div>
            <div class="form-group">
                <label for="typeSelect">Type:</label>
                <select id="typeSelect">
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                    <option value="episode">Episode</option>
                </select>
            </div>
            <button type="submit" class="btn-search">Search</button>
        </form>

        <div id="results" class="results"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box">
            <button type="button" id="modalCloseBtn" class="modal-close-btn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
